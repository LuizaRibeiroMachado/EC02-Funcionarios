<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestão de Funcionários</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
      <span class="navbar-brand">Gestão de Funcionários</span>
      <span class="navbar-text">Startup de Tecnologia</span>
    </div>
  </nav>

  <div class="container">

    <!-- formulario -->
    <div class="card mb-4">
      <div class="card-header" id="tituloForm">Cadastrar funcionário</div>
      <div class="card-body">
        <form id="formFuncionario" class="row g-3">
          <div class="col-md-4">
            <label for="nome" class="form-label">Nome</label>
            <input type="text" id="nome" class="form-control">
          </div>
          <div class="col-md-2">
            <label for="idade" class="form-label">Idade</label>
            <input type="number" id="idade" class="form-control" min="1">
          </div>
          <div class="col-md-3">
            <label for="cargo" class="form-label">Cargo</label>
            <input type="text" id="cargo" class="form-control">
          </div>
          <div class="col-md-3">
            <label for="salario" class="form-label">Salário</label>
            <input type="number" id="salario" class="form-control" min="0" step="0.01">
          </div>
          <div class="col-12">
            <button type="button" id="btnCadastrar" class="btn btn-primary">Cadastrar</button>
            <button type="button" id="btnCancelar" class="btn btn-secondary d-none">Cancelar</button>
          </div>
        </form>
      </div>
    </div>

    <!-- busca + tabela -->
    <div class="card mb-4">
      <div class="card-header">Funcionários cadastrados</div>
      <div class="card-body">
        <div class="input-group mb-3">
          <input type="text" id="campoBusca" class="form-control" placeholder="Buscar pelo nome">
          <button type="button" id="btnBuscar" class="btn btn-outline-primary">Buscar</button>
          <button type="button" id="btnLimparBusca" class="btn btn-outline-secondary">Mostrar todos</button>
        </div>
        <div class="table-responsive">
          <table class="table table-striped table-hover align-middle mb-0">
            <thead>
              <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Idade</th>
                <th>Cargo</th>
                <th>Salário</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="tabelaFuncionarios"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- relatorios -->
    <div class="card mb-4">
      <div class="card-header">Relatórios</div>
      <div class="card-body">
        <div class="d-flex flex-wrap gap-2 mb-3">
          <button type="button" id="btnSalarioMaior" class="btn btn-outline-primary">Salário maior que R$ 5000</button>
          <button type="button" id="btnMediaSalarial" class="btn btn-outline-primary">Média salarial</button>
          <button type="button" id="btnCargosUnicos" class="btn btn-outline-primary">Cargos únicos</button>
          <button type="button" id="btnNomesMaiusculo" class="btn btn-outline-primary">Nomes em maiúsculo</button>
        </div>
        <div id="relatorio" class="alert alert-secondary mb-0">Escolha um relatório.</div>
      </div>
    </div>

  </div>

  <script src="js/Funcionario.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
